services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: animal_farm_pgvector
    environment:
      POSTGRES_DB: animal_farm_rag_kag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - animal_farm_pgvector_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d animal_farm_rag_kag"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  animal_farm_pgvector_data:
